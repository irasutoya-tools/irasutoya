name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: choice
        options:
           - major
           - minor
           - patch
jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@4e97ecde5048e1e0816923020652678063ffbf65 # v1
        with:
          bundler-cache: true
          ruby-version: .ruby-version
      - name: Setup Git
        run: |
          git config --global user.email "unhappychoice@gmail.com"
          git config --global user.name "Yuji Ueki"
      - name: Install gem-release
        run: gem install gem-release
      - name: Bump version
        run: |
          git status
          gem bump --version ${{inputs.version}} --message ':tada: Bump %{name} to %{version}'
          git status
          bundle config set frozen false 
          bundle install
          git add .
          git commit --amend --no-edit
      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1
