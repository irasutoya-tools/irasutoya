name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: choice
        options:
           - major
           - minor
           - patch
jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
      - name: Setup Git
        run: |
          git config --global user.email "unhappychoice@gmail.com"
          git config --global user.name "Yuji Ueki"
      - name: Bump version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git status
          # Load the locked command directly so RubyGems plugin discovery is not needed.
          BUNDLE_FROZEN=true bundle exec ruby -rrubygems/command -rgem/release -rrubygems/commands/bump_command \
            -e 'Gem::Commands::BumpCommand.new.invoke(*ARGV)' -- \
            --version "$RELEASE_VERSION" --message ':tada: Bump %{name} to %{version}'
          git status
          bundle config set frozen false
          bundle install --local
          git add .
          git commit --amend --no-edit
      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1
