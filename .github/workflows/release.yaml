name: release

'on':
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
      - name: Verify release tag
        run: |
          ruby -e '
            tag = ENV.fetch("GITHUB_REF_NAME")
            version = Gem::Specification.load("irasutoya.gemspec").version.to_s
            unless tag.match?(/\Av(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\z/) && tag == "v#{version}"
              abort "Release tag #{tag.inspect} must be a stable version matching the gemspec (v#{version})."
            end
          '
      - uses: rubygems/release-gem@2654a0fe0dc39725c07fe84d7fe863a084f2424e # v1
