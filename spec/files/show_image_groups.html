<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>いろいろな角度から見たマスクのイラスト</title>
</head>
<body>
  <div class="post">
    <div class="title"><h2>いろいろな角度から見たマスクのイラスト</h2></div>
    <div class="entry">
      <img class="postthumb" src="https://example.com/thumbnail_mask.png" alt="">
      <div class="separator">マスク</div>
      <div class="separator">
        <a href="https://example.com/mask_front.png"><img src="https://example.com/mask_front.png" alt="正面から見たマスク"></a>
        <a href="https://example.com/mask_side.png"><img src="https://example.com/mask_side.png" alt="横から見たマスク"></a>
      </div>
      <hr>
      <div class="separator">フェイスシールド</div>
      <div class="separator">
        <a href="https://example.com/shield_front.png"><img src="https://example.com/shield_front.png" alt="正面から見たフェイスシールド"></a>
        <a href="https://example.com/shield_side.png"><img src="https://example.com/shield_side.png" alt="横から見たフェイスシールド"></a>
      </div>
      <div class="separator">
        既存のイラストと組み合わせて使うことができる、正面、斜め、横、上からみた白いマスクとフェイスシールド（フェイスガード）単体のイラストです。
      </div>
    </div>
  </div>
</body>
</html>
